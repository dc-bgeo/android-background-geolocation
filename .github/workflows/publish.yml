# Publishes dev.bgeo:background-geolocation to Maven Central on a version tag.
#
# One-time setup this workflow cannot do for itself — four repository secrets
# (Settings → Secrets and variables → Actions):
#
#   MAVEN_CENTRAL_USERNAME  Central Portal user token name  (NOT the account login)
#   MAVEN_CENTRAL_PASSWORD  Central Portal user token value
#   SIGNING_KEY             the ASCII-armoured private key:
#                             gpg --armor --export-secret-keys 5FD4CD6B4AE0C883
#   SIGNING_PASSWORD        that key's passphrase
#
# Central also requires the `dev.bgeo` namespace to stay verified and the
# public key to remain on a keyserver — both are already done, and neither
# expires on its own.
#
# The upload lands as a DRAFT: Central validates it and waits for a human to
# press Publish at https://central.sonatype.com/publishing. A Central release
# is immutable, so releasing stays a decision rather than a consequence of
# pushing a tag. To change that, set PUBLISHING_TYPE=AUTOMATIC below — and
# read tools/central-publish.sh first.
name: Publish to Maven Central

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # A tag that disagrees with the built artifact is worth failing on
      # before anything is signed: Maven Central never lets a version number
      # be reused, so publishing 0.1.0 from a v0.1.1 tag is unrecoverable.
      - name: Tag matches sdk/build.gradle.kts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' sdk/build.gradle.kts | head -1)
          tagged="${GITHUB_REF_NAME#v}"
          echo "declared=$declared tagged=$tagged"
          [ "$declared" = "$tagged" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match version $declared in sdk/build.gradle.kts"
            exit 1
          }

      - run: ./gradlew :sdk:test

      - name: Build, sign and upload the bundle
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./tools/central-publish.sh --upload

      - name: Where to look next
        run: |
          echo "### Uploaded to the Central Portal" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "It is a **draft**: open <https://central.sonatype.com/publishing>," >> "$GITHUB_STEP_SUMMARY"
          echo "check the validation result and press Publish." >> "$GITHUB_STEP_SUMMARY"
